[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battle-school-lunch-backend"
version = "0.1.0"
description = "Backend API for the battle school lunch application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "agent-framework-ag-ui>=1.1.0,<2.0.0",
  "agent-framework-devui==1.0.0b260813",
  "agent-framework-github-copilot>=1.0.2,<2.0.0",
  "agent-framework-orchestrations>=1.1.0,<2.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "mcp>=1.28.0,<2.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23.0,<5.0.0",
  "openapi-spec-validator>=0.7.0,<0.10.0",
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["migrations/*.sql"]
