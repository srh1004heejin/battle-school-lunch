services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_NAME: Battle School Lunch API
      BACKEND_CORS_ORIGIN: ${BACKEND_CORS_ORIGIN:-http://localhost:8080}
      CONNECT_TIMEOUT_SECONDS: ${CONNECT_TIMEOUT_SECONDS:-5}
      MAX_DATE_RANGE_DAYS: ${MAX_DATE_RANGE_DAYS:-31}
      NEIS_API_KEY: ${NEIS_API_KEY}
      NEIS_BASE_URL: ${NEIS_BASE_URL:-https://open.neis.go.kr/hub}
      NEIS_PAGE_SIZE: ${NEIS_PAGE_SIZE:-1000}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-10}
      RETRY_ATTEMPTS: ${RETRY_ATTEMPTS:-1}
      AGENT_MCP_URL: http://mcp:8000/mcp
      GITHUB_COPILOT_MODEL: ${GITHUB_COPILOT_MODEL:-}
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN:-}
      DATABASE_PATH: /app/backend/data/analyses.db
    volumes:
      - analysis-data:/app/backend/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      mcp:
        condition: service_started

  mcp:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.mcp_server"]
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      MCP_HOST: 0.0.0.0
      MCP_SERVER_PORT: 8000
    ports:
      - "${MCP_PORT:-8001}:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  analysis-data:
